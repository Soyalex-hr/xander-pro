<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="silver-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="192" height="192" rx="46" fill="url(#bg-grad)"/>
  <rect x="5" y="5" width="182" height="182" rx="41" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="3"/>

  <!-- Gourmet Catering Cloche & Gala Sparkle -->
  <g transform="translate(24, 28)">
    <!-- Plate / Base Rim -->
    <path d="M12 108 C12 104, 24 100, 72 100 C120 100, 132 104, 132 108 C132 112, 120 116, 72 116 C24 116, 12 112, 12 108 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M22 110 C22 107, 36 104, 72 104 C108 104, 122 107, 122 110 C122 113, 108 115, 72 115 C36 115, 22 113, 22 110 Z" fill="url(#silver-grad)"/>

    <!-- Cloche Dome -->
    <path d="M20 98 C20 54, 46 36, 72 36 C98 36, 124 54, 124 98 Z" fill="url(#silver-grad)"/>
    <!-- Dome specular reflection / highlights -->
    <path d="M34 94 C32 68, 50 48, 70 42 C64 48, 52 66, 52 94 Z" fill="#ffffff" opacity="0.45"/>

    <!-- Cloche Handle / Knob -->
    <circle cx="72" cy="27" r="9" fill="url(#gold-grad)"/>
    <rect x="70" y="32" width="4" height="6" rx="2" fill="url(#gold-grad)"/>

    <!-- 4-point Gala Star / Sparkle (Top Right) -->
    <g transform="translate(108, 14)" filter="url(#glow)">
      <path d="M16 0 Q16 16 32 16 Q16 16 16 32 Q16 16 16 0 Z" fill="url(#gold-grad)"/>
      <circle cx="16" cy="16" r="3" fill="#ffffff"/>
    </g>

    <!-- Mini sparkle (Bottom Left) -->
    <g transform="translate(6, 68)">
      <path d="M8 0 Q8 8 16 8 Q8 8 8 16 Q8 8 0 8 Q8 8 8 0 Z" fill="#ffffff" opacity="0.8"/>
    </g>
  </g>
</svg>